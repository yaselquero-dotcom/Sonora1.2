
name: Build SONORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Extraer proyecto SONORA
        run: |
          unzip -o SonoraMusic_redisenada_completa.zip -d proyecto
          test -f proyecto/SonoraMusic/settings.gradle
          test -f proyecto/SonoraMusic/app/build.gradle

      - name: Compilar APK de prueba
        run: |
          cd proyecto/SonoraMusic
          gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-debug-APK
          path: proyecto/SonoraMusic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
